# Blueprint de Render para Supli: el backend en Docker y el frontend como
# sitio estático. En Render: New → Blueprint → este repositorio.
#
# La base de datos ya existe (supli_tech, en Oregon), así que no se crea aquí.
# Las DB_* se pegan a mano la primera vez (sync: false) con los datos de la
# base. Dentro de Render se usa el host interno (sin SSL: DB_SSLMODE=prefer);
# DB_SCHEMA es el schema donde viven las tablas (se crea con crear_schema).
#
# Si Render le asigna otro dominio a alguno de los dos servicios (por ejemplo
# porque el nombre ya está tomado), hay que corregir CORS_ALLOWED_ORIGINS,
# CSRF_TRUSTED_ORIGINS y VITE_API_URL con los dominios reales.
services:
  - type: web
    name: supli-api-backend
    runtime: docker
    plan: free
    # La misma región de la base, para poder usar su URL interna.
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    # El contexto es backend/: ahí están requirements.txt y manage.py.
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: prefer
      - key: DB_SCHEMA
        value: app_supli
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://appsupli.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://appsupli.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: appsupli
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22.17.0"
      # Se lee al construir: si cambia el dominio del backend, hay que volver
      # a desplegar el frontend.
      - key: VITE_API_URL
        value: https://supli-api-backend.onrender.com/api
    routes:
      # Es una SPA: cualquier ruta (/inicio/…, /tablero/<token>) la resuelve React.
      - type: rewrite
        source: /*
        destination: /index.html
